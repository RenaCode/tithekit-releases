name: Bug report
description: Something in TitheKit does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Replies are best effort, usually within a few working days.

        **Security vulnerabilities must not be reported here.** Follow [SECURITY.md](https://github.com/RenaCode/tithekit-releases/blob/main/SECURITY.md) instead.
        Do not paste license keys, passwords, tokens or other secrets into this issue.
  - type: input
    id: version
    attributes:
      label: TitheKit version
      description: Output of `tithekit --version`, or the release tag you downloaded.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      description: For example "macOS 26.1, Mac mini M4". Apple menu > About This Mac.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact commands or actions, starting from a fresh state if you can.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened instead
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output or logs
      description: Remove anything private (hostnames, user names, keys) before pasting.
      render: shell
